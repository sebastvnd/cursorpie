name: CI

# Pull requests and `main` are checked. A branch without a pull request is not: open a draft pull
# request to get CI on it. A `v*` tag also checks that the tag matches the release in the files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request replaces the run that is still going; runs on main and tags finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Linux backend links to the X11 libraries (see CONTRIBUTING.md, "Prerequisites").
      - name: Linux libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxrandr-dev
      # One command for everything, so what passes on your machine passes here (tools/src/ci.rs
      # holds the list: format, version files, clippy, tests, doc tests, docs on macOS, and the
      # Windows backend checks on macOS and Linux).
      - name: Checks
        run: cargo tools ci
      - name: Build release
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release
      # The tag of a release must be the version in Cargo.toml, with the notes moved out of
      # "Unreleased" (see CONTRIBUTING.md, "Releasing").
      - name: Tag matches the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        env:
          TAG: ${{ github.ref_name }}
        run: cargo tools check --tag "$TAG"

  # Produce distributable packages in addition to running the checks above. These jobs run for
  # pull requests too, so packaging regressions are caught before a merge. The artifacts are
  # downloadable from the corresponding GitHub Actions run.
  package-macos:
    name: Package macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build universal DMG
        env:
          UNIVERSAL: "1"
        run: scripts/make-dmg.sh
      - name: Prepare stable release asset names
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/CursorPie-$version-universal.dmg" target/bundle/CursorPie-macos-universal.dmg
          (cd target/bundle && shasum -a 256 CursorPie-macos-universal.dmg > CursorPie-macos-universal.dmg.sha256)
      # The update (src/update/install.rs) opens this image, copies CursorPie.app out of it and runs the
      # program with --selftest before it replaces the installed app: do exactly that here.
      - name: Packaged app starts
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noverify -quiet -mountpoint "$mnt" target/bundle/CursorPie-macos-universal.dmg
          "$mnt/CursorPie.app/Contents/MacOS/CursorPie" --selftest
          hdiutil detach "$mnt" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-macos-universal
          path: |
            target/bundle/CursorPie-macos-universal.dmg
            target/bundle/CursorPie-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  package-windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner image usually has Inno Setup already, and winget's download from GitHub times out
      # now and then (0x80072ee2), so install only when it is missing and try a few times.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $have = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ($have) { Write-Host "Inno Setup is already installed."; exit 0 }
          for ($i = 1; $i -le 3; $i++) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "winget failed (attempt $i), retrying"
            Start-Sleep -Seconds (10 * $i)
          }
          exit 1
      - name: Build ZIP and Setup installer
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - name: Prepare stable installer name
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Copy-Item "target\bundle\CursorPie-$version-setup.exe" "target\bundle\CursorPie-windows-setup.exe"
      # The update runs this Setup silently with these switches (src/update/install.rs): do the same
      # here, so a change to installer/cursorpie.iss that breaks it fails before a release.
      - name: Setup installs silently
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "target\bundle\CursorPie-windows-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!startup" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup ended with $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\CursorPie\cursorpie.exe"
          if (-not (Test-Path $exe)) { throw "Setup did not install $exe" }
          $run = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The installed program does not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-windows-x86_64
          path: |
            target/bundle/CursorPie-windows.zip
            target/bundle/CursorPie-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  package-linux-ubuntu:
    name: Package Linux (Ubuntu x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxi-dev libxtst-dev libxrandr-dev
      - name: Build Linux package
        run: scripts/package-linux.sh
      - name: Prepare Ubuntu release asset name
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz
      # The update unpacks the archive, takes <folder>/cursorpie and runs it with --selftest.
      - name: Packaged program starts
        run: |
          dir="$(mktemp -d)"
          tar -xzf target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz -C "$dir"
          "$dir"/*/cursorpie --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-linux-ubuntu-x86_64
          path: target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  package-linux-fedora:
    name: Package Linux (Fedora 44 x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Fedora Rust caches
        run: mkdir -p "$HOME/.cache/cursorpie-fedora/cargo" "$HOME/.cache/cursorpie-fedora/rustup"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cursorpie-fedora/cargo
            ~/.cache/cursorpie-fedora/rustup
          key: fedora-44-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build inside Fedora 44
        run: |
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker run --rm \
            --env HOST_UID="$host_uid" \
            --env HOST_GID="$host_gid" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cache/cursorpie-fedora/cargo:/root/.cargo" \
            --volume "$HOME/.cache/cursorpie-fedora/rustup:/root/.rustup" \
            --workdir /workspace \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf install -y gcc libX11-devel libXi-devel libXtst-devel libXrandr-devel curl tar gzip
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              source /root/.cargo/env
              rustup update stable
              scripts/package-linux.sh
              version=$(grep -m1 "^version" Cargo.toml | cut -d \" -f2)
              cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-fedora-44-x86_64.tar.gz
              dir=$(mktemp -d)
              tar -xzf target/bundle/CursorPie-fedora-44-x86_64.tar.gz -C "$dir"
              "$dir"/*/cursorpie --selftest
              chown -R "$HOST_UID:$HOST_GID" target
            '
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-linux-fedora-44-x86_64
          path: target/bundle/CursorPie-fedora-44-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # A version tag turns the validated packages into public, ready-to-install Release assets.
  publish-release:
    name: Publish GitHub Release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - package-macos
      - package-windows
      - package-linux-ubuntu
      - package-linux-fedora
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CursorPie-*
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -lah release-assets
      # The update looks for these files by name (asset_name in src/update/install.rs).
      - name: The files the update looks for are there
        run: |
          for name in CursorPie-macos-universal.dmg CursorPie-macos-universal.dmg.sha256 \
                      CursorPie-windows-setup.exe CursorPie-windows.zip \
                      CursorPie-ubuntu-24.04-x86_64.tar.gz CursorPie-fedora-44-x86_64.tar.gz; do
            test -f "release-assets/$name" || { echo "missing $name"; exit 1; }
          done
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
