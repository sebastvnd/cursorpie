name: CI

# Pull requests and `main` are checked. A branch without a pull request is not: open a draft pull
# request to get CI on it. A `v*` tag also checks that the tag matches the release in the files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request replaces the run that is still going; runs on main and tags finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Linux backend links to the X11 libraries (see CONTRIBUTING.md, "Prerequisites").
      - name: Linux libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxrandr-dev
      # One command for everything, so what passes on your machine passes here (tools/src/ci.rs
      # holds the list: format, version files, clippy, tests, doc tests, docs on macOS, and the
      # Windows backend checks on macOS and Linux).
      - name: Checks
        run: cargo tools ci
      - name: Build release
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release
      # The build that keeps the diagnostic log (About, Developer mode) is a release with one more
      # feature; it must keep compiling, and an ordinary release must stay free of the log code.
      - name: Log build compiles
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --release --features debug-log
      # The tag of a release must be the version in Cargo.toml, with the notes moved out of
      # "Unreleased" (see CONTRIBUTING.md, "Releasing").
      - name: Tag matches the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        env:
          TAG: ${{ github.ref_name }}
        run: cargo tools check --tag "$TAG"

  # Produce distributable packages in addition to running the checks above. These jobs run for
  # pull requests too, so packaging regressions are caught before a merge. The artifacts are
  # downloadable from the corresponding GitHub Actions run.
  package-macos:
    name: Package macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build universal DMG
        env:
          UNIVERSAL: "1"
        run: scripts/make-dmg.sh
      - name: Prepare stable release asset names
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/CursorPie-$version-universal.dmg" target/bundle/CursorPie-macos-universal.dmg
          (cd target/bundle && shasum -a 256 CursorPie-macos-universal.dmg > CursorPie-macos-universal.dmg.sha256)
      # The update (src/update/install.rs) opens this image, copies CursorPie.app out of it and runs the
      # program with --selftest before it replaces the installed app: do exactly that here.
      - name: Packaged app starts
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noverify -quiet -mountpoint "$mnt" target/bundle/CursorPie-macos-universal.dmg
          "$mnt/CursorPie.app/Contents/MacOS/CursorPie" --selftest
          hdiutil detach "$mnt" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-macos-universal
          path: |
            target/bundle/CursorPie-macos-universal.dmg
            target/bundle/CursorPie-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  package-windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner image usually has Inno Setup already, and winget's download from GitHub times out
      # now and then (0x80072ee2), so install only when it is missing and try a few times.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $have = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ($have) { Write-Host "Inno Setup is already installed."; exit 0 }
          for ($i = 1; $i -le 3; $i++) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "winget failed (attempt $i), retrying"
            Start-Sleep -Seconds (10 * $i)
          }
          exit 1
      - name: Build ZIP and Setup installer
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - name: Prepare stable installer name
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Copy-Item "target\bundle\CursorPie-$version-setup.exe" "target\bundle\CursorPie-windows-setup.exe"
      # The update runs this Setup silently with these switches (src/update/install.rs): do the same
      # here, so a change to installer/cursorpie.iss that breaks it fails before a release.
      - name: Setup installs silently
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "target\bundle\CursorPie-windows-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!startup" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup ended with $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\CursorPie\cursorpie.exe"
          if (-not (Test-Path $exe)) { throw "Setup did not install $exe" }
          $run = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The installed program does not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-windows-x86_64
          path: |
            target/bundle/CursorPie-windows.zip
            target/bundle/CursorPie-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  package-linux-ubuntu:
    name: Package Linux (Ubuntu x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxi-dev libxtst-dev libxrandr-dev
      - name: Build Linux package
        run: scripts/package-linux.sh
      - name: Prepare Ubuntu release asset name
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz
      # The update unpacks the archive, takes <folder>/cursorpie and runs it with --selftest.
      - name: Packaged program starts
        run: |
          dir="$(mktemp -d)"
          tar -xzf target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz -C "$dir"
          "$dir"/*/cursorpie --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-linux-ubuntu-x86_64
          path: target/bundle/CursorPie-ubuntu-24.04-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  package-linux-fedora:
    name: Package Linux (Fedora 44 x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Fedora Rust caches
        run: mkdir -p "$HOME/.cache/cursorpie-fedora/cargo" "$HOME/.cache/cursorpie-fedora/rustup"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cursorpie-fedora/cargo
            ~/.cache/cursorpie-fedora/rustup
          key: fedora-44-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build inside Fedora 44
        run: |
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker run --rm \
            --env HOST_UID="$host_uid" \
            --env HOST_GID="$host_gid" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cache/cursorpie-fedora/cargo:/root/.cargo" \
            --volume "$HOME/.cache/cursorpie-fedora/rustup:/root/.rustup" \
            --workdir /workspace \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf install -y gcc libX11-devel libXi-devel libXtst-devel libXrandr-devel curl tar gzip
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              source /root/.cargo/env
              rustup update stable
              scripts/package-linux.sh
              version=$(grep -m1 "^version" Cargo.toml | cut -d \" -f2)
              cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-fedora-44-x86_64.tar.gz
              dir=$(mktemp -d)
              tar -xzf target/bundle/CursorPie-fedora-44-x86_64.tar.gz -C "$dir"
              "$dir"/*/cursorpie --selftest
              chown -R "$HOST_UID:$HOST_GID" target
            '
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-linux-fedora-44-x86_64
          path: target/bundle/CursorPie-fedora-44-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The build that keeps the diagnostic log (docs/DEBUGGING.md, "Developer mode"). The app offers it
  # to a person who turns on Developer mode in About: the same release, the same program built with
  # `--features debug-log`, named CursorPie-devlog-*. It is built for a version tag (and on demand),
  # not for every pull request: the packaging is the same as above, only the cargo arguments differ.
  package-devlog-macos:
    name: Package macOS log build (universal)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build universal DMG with the log
        env:
          UNIVERSAL: "1"
          CURSORPIE_CARGO_ARGS: --features debug-log
        run: scripts/make-dmg.sh
      - name: Prepare stable release asset names
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/CursorPie-$version-universal.dmg" target/bundle/CursorPie-devlog-macos-universal.dmg
          (cd target/bundle && shasum -a 256 CursorPie-devlog-macos-universal.dmg > CursorPie-devlog-macos-universal.dmg.sha256)
      - name: Packaged app starts and has the log
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noverify -quiet -mountpoint "$mnt" target/bundle/CursorPie-devlog-macos-universal.dmg
          "$mnt/CursorPie.app/Contents/MacOS/CursorPie" --selftest | tee /dev/stderr | grep -q "(log build)"
          hdiutil detach "$mnt" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-devlog-macos-universal
          path: |
            target/bundle/CursorPie-devlog-macos-universal.dmg
            target/bundle/CursorPie-devlog-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  package-devlog-windows:
    name: Package Windows log build (x86_64)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $have = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ($have) { Write-Host "Inno Setup is already installed."; exit 0 }
          for ($i = 1; $i -le 3; $i++) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "winget failed (attempt $i), retrying"
            Start-Sleep -Seconds (10 * $i)
          }
          exit 1
      - name: Build ZIP and Setup installer with the log
        shell: pwsh
        env:
          CURSORPIE_CARGO_ARGS: --features debug-log
        run: .\scripts\package-windows.ps1
      - name: Prepare stable installer names
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Copy-Item "target\bundle\CursorPie-$version-setup.exe" "target\bundle\CursorPie-devlog-windows-setup.exe"
          Copy-Item "target\bundle\CursorPie-windows.zip" "target\bundle\CursorPie-devlog-windows.zip"
      - name: Setup installs silently and the program has the log
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "target\bundle\CursorPie-devlog-windows-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!startup" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup ended with $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\CursorPie\cursorpie.exe"
          if (-not (Test-Path $exe)) { throw "Setup did not install $exe" }
          # The program has no console (windows subsystem): `& $exe` would not wait for it and would
          # close the pipe under its stdout, so its output goes to a file and Start-Process waits.
          $outFile = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $run = Start-Process -FilePath $exe -ArgumentList "--selftest" -RedirectStandardOutput $outFile -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The installed program does not start" }
          $out = Get-Content -Raw $outFile
          if ("$out" -notmatch "\(log build\)") { throw "The program has no log: $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-devlog-windows-x86_64
          path: |
            target/bundle/CursorPie-devlog-windows.zip
            target/bundle/CursorPie-devlog-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  package-devlog-linux-ubuntu:
    name: Package Linux log build (Ubuntu x86_64)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxi-dev libxtst-dev libxrandr-dev
      - name: Build Linux package with the log
        env:
          CURSORPIE_CARGO_ARGS: --features debug-log
        run: scripts/package-linux.sh
      - name: Prepare Ubuntu release asset name
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)
          cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-devlog-ubuntu-24.04-x86_64.tar.gz
      - name: Packaged program starts and has the log
        run: |
          dir="$(mktemp -d)"
          tar -xzf target/bundle/CursorPie-devlog-ubuntu-24.04-x86_64.tar.gz -C "$dir"
          "$dir"/*/cursorpie --selftest | tee /dev/stderr | grep -q "(log build)"
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-devlog-linux-ubuntu-x86_64
          path: target/bundle/CursorPie-devlog-ubuntu-24.04-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  package-devlog-linux-fedora:
    name: Package Linux log build (Fedora 44 x86_64)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Fedora Rust caches
        run: mkdir -p "$HOME/.cache/cursorpie-fedora/cargo" "$HOME/.cache/cursorpie-fedora/rustup"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cursorpie-fedora/cargo
            ~/.cache/cursorpie-fedora/rustup
          key: fedora-44-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build inside Fedora 44 with the log
        run: |
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker run --rm \
            --env HOST_UID="$host_uid" \
            --env HOST_GID="$host_gid" \
            --env CURSORPIE_CARGO_ARGS="--features debug-log" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cache/cursorpie-fedora/cargo:/root/.cargo" \
            --volume "$HOME/.cache/cursorpie-fedora/rustup:/root/.rustup" \
            --workdir /workspace \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf install -y gcc libX11-devel libXi-devel libXtst-devel libXrandr-devel curl tar gzip
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              source /root/.cargo/env
              rustup update stable
              scripts/package-linux.sh
              version=$(grep -m1 "^version" Cargo.toml | cut -d \" -f2)
              cp "target/bundle/cursorpie-$version-linux-x86_64.tar.gz" target/bundle/CursorPie-devlog-fedora-44-x86_64.tar.gz
              dir=$(mktemp -d)
              tar -xzf target/bundle/CursorPie-devlog-fedora-44-x86_64.tar.gz -C "$dir"
              "$dir"/*/cursorpie --selftest | tee /dev/stderr | grep -q "(log build)"
              chown -R "$HOST_UID:$HOST_GID" target
            '
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPie-devlog-linux-fedora-44-x86_64
          path: target/bundle/CursorPie-devlog-fedora-44-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # `cpd`, the diagnostic logs in a terminal (tools/src/cpd.rs). One small program with no
  # dependencies per system, built for a version tag (and on demand) and attached to the release.
  # On Linux it is built for musl, so it runs on every distribution.
  package-cpd:
    name: cpd (${{ matrix.system }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, system: macos-universal, asset: cpd-macos-universal }
          - { os: windows-latest, system: windows-x86_64, asset: cpd-windows-x86_64.exe }
          - { os: ubuntu-24.04, system: linux-x86_64, asset: cpd-linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (macOS, both architectures)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p cursorpie-tools --bin cpd --target aarch64-apple-darwin
          cargo build --release -p cursorpie-tools --bin cpd --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/${{ matrix.asset }} \
            target/aarch64-apple-darwin/release/cpd target/x86_64-apple-darwin/release/cpd
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p cursorpie-tools --bin cpd
          mkdir -p dist
          cp target/release/cpd.exe dist/${{ matrix.asset }}
      - name: Build (Linux, static)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p cursorpie-tools --bin cpd --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/cpd dist/${{ matrix.asset }}
      - name: It runs
        shell: bash
        run: |
          chmod +x dist/${{ matrix.asset }}
          dist/${{ matrix.asset }} help | head -n 3
          dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: cpd-${{ matrix.system }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30

  # A version tag turns the validated packages into public, ready-to-install Release assets.
  publish-release:
    name: Publish GitHub Release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - package-macos
      - package-windows
      - package-linux-ubuntu
      - package-linux-fedora
      - package-devlog-macos
      - package-devlog-windows
      - package-devlog-linux-ubuntu
      - package-devlog-linux-fedora
      - package-cpd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CursorPie-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cpd-*
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -lah release-assets
      # The update looks for these files by name (asset_name in src/update/install.rs).
      - name: The files the update looks for are there
        run: |
          for name in CursorPie-macos-universal.dmg CursorPie-macos-universal.dmg.sha256 \
                      CursorPie-windows-setup.exe CursorPie-windows.zip \
                      CursorPie-ubuntu-24.04-x86_64.tar.gz CursorPie-fedora-44-x86_64.tar.gz \
                      CursorPie-devlog-macos-universal.dmg CursorPie-devlog-macos-universal.dmg.sha256 \
                      CursorPie-devlog-windows-setup.exe CursorPie-devlog-windows.zip \
                      CursorPie-devlog-ubuntu-24.04-x86_64.tar.gz CursorPie-devlog-fedora-44-x86_64.tar.gz \
                      cpd-macos-universal cpd-windows-x86_64.exe cpd-linux-x86_64; do
            test -f "release-assets/$name" || { echo "missing $name"; exit 1; }
          done
      # Settings (About > Developer tools > Terminal command) checks the cpd it downloads against
      # these (src/cpdtool.rs), the same way an update checks its package.
      - name: Checksums of cpd
        run: |
          cd release-assets
          for name in cpd-macos-universal cpd-windows-x86_64.exe cpd-linux-x86_64; do
            sha256sum "$name" > "$name.sha256"
          done
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
