
name: Deploy CursorPie Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/

          for file in README.md CHANGELOG.md CONTRIBUTING.md; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          if [ -d docs ]; then
            cp -R docs _site/
          fi

          # Flow Hub (https://sebastvnd.github.io/cursorpie/flowhub/): its page, catalog.json and the
          # flow files must be published too, or the URL answers "404 File not found".
          if [ -d flowhub ]; then
            cp -R flowhub _site/
          fi

          # Blog (https://sebastvnd.github.io/cursorpie/blog/): static pages, one folder per post.
          if [ -d blog ]; then
            cp -R blog _site/
          fi

          if [ -f diag/README.md ]; then
            mkdir -p _site/diag
            cp diag/README.md _site/diag/
          fi

          # SEO files: crawler rules, sitemap and Google Search Console verification file.
          for file in robots.txt sitemap.xml google*.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          touch _site/.nojekyll

      - name: Check that Flow Hub is in the site
        run: |
          test -f _site/flowhub/index.html
          test -f _site/flowhub/catalog.json
          test -f _site/assets/flowhub.js
          test -f _site/assets/flowhub.css

      - name: Check that the blog is in the site
        run: |
          test -f _site/blog/index.html
          test -f _site/assets/blog.css
          test -f _site/assets/blog.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
