name: Deploy CursorPie Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Default: no access. Each job asks only for what it needs.
permissions:
  contents: read

# Never cancel a running Pages deployment: cancelling the run between "upload"
# and "deploy" is what produces `No artifacts named "github-pages" were found`.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD: assemble _site and upload it as the "github-pages" artifact.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/

          for file in README.md CHANGELOG.md CONTRIBUTING.md; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          if [ -d docs ]; then
            cp -R docs _site/
          fi

          # Flow Hub (https://sebastvnd.github.io/cursorpie/flowhub/): its page, catalog.json and the
          # flow files must be published too, or the URL answers "404 File not found".
          if [ -d flowhub ]; then
            cp -R flowhub _site/
          fi

          # Developer pages. The Kanban page reads the board and the cards straight from kanban/.
          cp -R developer _site/
          cp -R kanban _site/

          if [ -f diag/README.md ]; then
            mkdir -p _site/diag
            cp diag/README.md _site/diag/
          fi

          # SEO files: crawler rules, sitemap and Google Search Console verification file.
          for file in robots.txt sitemap.xml google*.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

      - name: Check that Flow Hub is in the site
        run: |
          test -f _site/flowhub/index.html
          test -f _site/flowhub/catalog.json
          test -f _site/assets/flowhub.js
          test -f _site/assets/flowhub.css

      - name: Check that the developer pages are in the site
        run: |
          test -f _site/developer/index.html
          test -f _site/developer/kanban/index.html
          test -f _site/assets/developer.js
          test -f _site/assets/developer.css
          test -f _site/kanban/BOARD.md

      - name: Check the artifact has no symlinks or hardlinks
        run: |
          if [ -n "$(find _site -type l)" ]; then
            echo "Symlinks are not allowed in a Pages artifact:"
            find _site -type l
            exit 1
          fi

      # Note: upload-pages-artifact@v4 skips hidden files (.nojekyll included).
      # That is fine: deploying through Actions does not run Jekyll.
      - name: Upload website artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  # ---------------------------------------------------------------------------
  # 2. DEPLOY: a separate job, so the artifact is fully stored before it is read.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write      # publish to Pages
      id-token: write   # verify the deployment comes from this workflow
      actions: read     # let deploy-pages list the "github-pages" artifact (needed on private repos)

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
