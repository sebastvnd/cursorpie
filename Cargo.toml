[package]
name = "cursorpie"
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
description = "Hold-to-open pie menu for macOS, Windows and Linux (X11): per-app profiles, shortcuts, launchers and submenus."
license = "MIT"

authors = ["sebastvnd@gmail.com"]
repository = "https://github.com/sebastvnd/cursorpie"

# The developer tools (`cargo tools ...`, see CONTRIBUTING.md) are a second package of this workspace.
# It is not part of the app: `cargo build` and `cargo test` of the root package never touch it, so
# test it with `cargo test --workspace` (what `cargo tools ci` does).
[workspace]
members = ["tools"]

[features]
# Compiles the Windows backend on any OS so `cargo check --features check-windows` can type-check
# it (and its pure helpers can be unit tested) without a Windows machine. Not needed on Windows.
check-windows = ["dep:windows-sys"]

[dependencies]
# UI (egui 0.36 uses `App::ui` + `App::logic`, same as the original code).
# `eframe` is declared per target below, because the renderer differs between the OSes.

# Reads the multi-page TIFF macOS hands out for app icons. Only the codecs macOS uses are enabled.
# Kept for every target because the decoder is plain Rust and its tests run everywhere.
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }

# The native window handle (HWND), to strip the OS frame of the Windows window (see ui::app).
# Same major version eframe uses, so there is only one copy.
raw-window-handle = "0.6"

# Config + icons
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Windows backend, only enabled by the `check-windows` feature on other targets (see [target.'cfg(windows)']).
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# UI on macOS (and on any other target that only builds the test stub): eframe's default features,
# that is the `wgpu` renderer (Metal on macOS).
[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
eframe = "0.36"

# Linux: the same `glow` renderer as Windows (per-pixel alpha, and it works without Vulkan). Only the
# `x11` window system is enabled, on purpose: in a Wayland session the window then runs through
# XWayland, where it can be placed under the pointer, and the X11 backend (see platform::linux)
# sees the same windows. Build needs the development files of libx11, libxi, libxtst and
# libxrandr (see CONTRIBUTING.md). Never add the `wgpu` feature here.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "x11",
] }

# macOS: event tap, frontmost app, activation policy (no Dock icon), app icons.
[target.'cfg(target_os = "macos")'.dependencies]
# Event tap. Keep the core-graphics / core-foundation versions that already
# compile in your current project if they differ from these.
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    "NSImage",
] }
# App icons: NSWorkspace hands out the icon as TIFF data (NSString / NSURL / NSData for the calls)
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData"] }

# Tray / menu bar icon (muda menus are re-exported as `tray_icon::menu`). Not built on other
# targets: on Linux it would need GTK (the Linux tray is future work, docs/LINUX_MIGRATION.md).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.25"

# Windows: low-level hooks, SendInput, registry, DPI, file chooser, and the UI.
[target.'cfg(windows)'.dependencies]
# The pie and the Settings card are drawn on a transparent, borderless window. With eframe's
# default `wgpu` renderer that window was opaque on Windows (the pie sat in a black box); the
# `glow` (OpenGL) renderer asks for a pixel format with an alpha channel and winit enables
# per-pixel alpha, which is the combination that gives a transparent window there.
# Turn the default features off: with both renderers compiled in, eframe prefers `wgpu`.
# Never add the `wgpu` feature here (see docs/UI_DESIGN.md, "Transparent window on Windows").
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.docs.rs]
# docs.rs builds the docs for an Apple target by default; the Windows backend is documented
# with the extra target below.
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
# Show the internals (tap, ui, ...) too: this is documentation for contributors.
rustdoc-args = ["--document-private-items"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
